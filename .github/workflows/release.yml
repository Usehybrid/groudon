name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: ['main']

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC), same as charizard — no long-lived NPM_TOKEN
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+ (node 24 + pnpm + npm auth)
        # same toolchain action as charizard; pnpm comes from packageManager in package.json
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
          registry-url: 'https://registry.npmjs.org'

      - name: Install Packages
        run: vp install

      - name: Build
        run: vp run build

      - name: Publish Package
        # publish only on v* tag pushes; PR runs are build-only
        if: startsWith(github.ref, 'refs/tags/v')
        # npm (>=11.5, bundled with node 24) exchanges the OIDC token itself and attaches provenance
        run: npm publish --provenance --access public

      - name: Slack - Build Success
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: act10ns/slack@v2.2.0
        with:
          status: ${{ job.status }}
          channel: '#alerts-deploys'
          message: 'Groudon was successfully published to npm'

      - name: Slack - Build Failed
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        uses: act10ns/slack@v2.2.0
        with:
          status: ${{ job.status }}
          channel: '#alerts-deploys'
          message: 'Groudon has failed to publish to npm'
