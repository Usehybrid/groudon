name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: ['main']

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo + install pnpm
        uses: actions/checkout@v7

      - name: Setup pnpm
        # version comes from the packageManager field in package.json
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # cssnano 9 needs ^24.15.0 on the 24 line; pnpm 12 needs >=22
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install Packages
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Publish Package
        # publish only on v* tag pushes; PR runs are build-only
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Slack - Build Success
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: act10ns/slack@v2.2.0
        with:
          status: ${{ job.status }}
          channel: '#alerts-deploys'
          message: 'Groudon was successfully published to npm'

      - name: Slack - Build Failed
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        uses: act10ns/slack@v2.2.0
        with:
          status: ${{ job.status }}
          channel: '#alerts-deploys'
          message: 'Groudon has failed to publish to npm'
